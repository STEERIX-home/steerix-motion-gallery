<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Steerix motion detail — preview and customize live logo animations." />
    <title>Motion · Steerix Motion Gallery</title>
    <link rel="stylesheet" href="./src/gallery.css?v=4" />
  </head>
  <body>
    <main>
      <a class="back-link" href="./">← 갤러리로 돌아가기</a>

      <div data-detail-root>
        <header>
          <p class="eyebrow">Motion detail</p>
          <h1 data-detail-title>Loading…</h1>
          <p class="meta" data-detail-meta></p>
        </header>

        <div class="detail-layout">
          <div class="detail-preview" data-detail-preview aria-live="polite"></div>
          <aside class="detail-panel" data-detail-panel aria-label="Motion controls"></aside>
        </div>
      </div>
    </main>

    <script>
      if (location.protocol === "file:") {
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML =
            '<main style="max-width:640px;margin:0 auto;padding:48px 24px;font-family:Inter,system-ui,sans-serif;line-height:1.6;color:#f5f7f8;background:#030506;min-height:100svh">' +
            '<p style="margin:0 0 8px;color:#55f18d;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase">Local preview required</p>' +
            "<h1 style=\"margin:0 0 16px;font-size:2rem;line-height:1.1\">로컬 서버에서 열어야 합니다</h1>" +
            '<p style="margin:0 0 16px;color:rgb(236 243 239 / 0.72)">motion.html을 직접 열면 ES Module 로드가 차단됩니다.</p>' +
            '<pre style="margin:0 0 16px;padding:16px;border-radius:16px;background:rgb(255 255 255 / 0.05);overflow:auto">cd steerix-motion-gallery\n./start.sh</pre>' +
            '<p style="margin:0;color:rgb(236 243 239 / 0.72)">실행 후 <a href="http://localhost:8765/" style="color:#78ffa8">http://localhost:8765/</a> 를 여세요.</p>' +
            "</main>";
          document.title = "Local server required · Steerix Motion Gallery";
        });
      }
    </script>
    <script type="module">
      import { initMotionDetail } from "./src/motion-detail.js?v=4";
      initMotionDetail();
    </script>
  </body>
</html>
